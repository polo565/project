name: Build AdBlock APK

on:
  push:
    paths:
      - 'adblock/**'
      - '.github/workflows/build-adblock.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adblock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Génère les fichiers Android manquants ; le manifeste et le code Kotlin du dépôt sont conservés.
      - name: Generate Android project
        run: flutter create --platforms=android --org com.polo --project-name adblock .

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: adblock-apk
          path: adblock/build/app/outputs/flutter-apk/app-release.apk
